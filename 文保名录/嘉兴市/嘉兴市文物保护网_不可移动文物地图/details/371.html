<h2>来源所列等级</h2><p>文保点</p>

<h2>简介</h2><p>永昌桥位于嘉兴市秀洲区新塍镇洛兴村15组与16组的交界处。南北向跨东石桥浜，系三孔梁式平板石桥，据当地村民介绍，该桥始建于民国时期。桥面为两块弧形天罡石平铺分三节组成。东西两侧桥额刻有“永昌桥”字样，无纹饰，无楹联。桥长全16米，宽1.55米，矢高2.59米。该桥侧看为弧形，是嘉兴地区现存梁式石板桥中较为少见的形制，有一定的研究价值。</p>
