<h2>简介</h2><p>沈庄桥位于嘉兴市南湖区新丰镇金章村李家头自然村与平湖曹桥街道愚桥村交界处。据形制和周边村民了解为清代建造，为单孔无栏石拱桥。东西向跨沈庄桥港，全长33.3米，桥面宽2.4米，拱跨9.6米，河面净跨30米，矢高4.5米，顶盘石边长1.2米。因桥身布满植物藤蔓，桥额、联及纹饰无法辨认。该桥规模很大，在嘉兴地区不多见，具有较高的历史价值和科学价值。</p>
