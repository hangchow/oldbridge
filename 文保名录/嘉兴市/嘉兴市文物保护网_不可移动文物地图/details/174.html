<h2>简介</h2><p>周家湾遗址位于大桥镇建国村周家湾自然村。东面紧靠何家塘河港，南、北、西三面与农田相连，为新石器时代（良渚文化）晚期至春秋战国时期的古文化遗存。遗址分布在农田内，面积约2万平方米，河港东西向流过，地势略低凹。出土陶片较多，还有石器发现。陶片的标本以印纹陶为主，其次为良渚文化陶器。周家湾遗址1992年8月公布为市级文保点，有较高的历史、科学价值。</p>
