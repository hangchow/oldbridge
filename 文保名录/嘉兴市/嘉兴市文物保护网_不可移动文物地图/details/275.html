<h2>简介</h2><p>一里街徐氏民居位于嘉兴市秀洲区王江泾镇一里街东端。据屋主介绍和其形制判断为清时建，坐北朝南，为二层一进二开间楼房。硬山顶，砖木结构，抬梁式五檩，地面铺错逢小青砖。面阔7.73米，进深6.86米。原有三进，现存的为原有厅堂，其余均被日本人烧毁。<br>该民居可能是一里街所剩的抗战前唯一的民宅，具有一定的历史、科学价值。</p>
