<h2>简介</h2><p>三星村庄桥位于嘉兴市南湖区凤桥镇三星村13组，地方志无载，据周围村民介绍和形制判断为清建。南北横跨横桥港，为三孔石板桥，桥柱由三块石板组成，全长22.46米，桥面宽1.36米，桥底距水面高度3.4米，南北两侧各有11级台阶，落坡呈喇叭状。该桥历史悠久，形制颇大，为当地重要历史建筑，具有较高历史和科学价值。</p>
