<h2>简介</h2><p>钱家湾大礼堂位于嘉兴市秀州区新塍镇观音桥村4组，东距乍嘉苏高速公路200米，于20世纪60年代建造。坐北朝南，硬山顶，砖混结构，人字形木梁架。面阔20米，进深10米，高6米。东西两面墙印有毛主席语录，地面由小青砖铺成。该礼堂当时是村生产队集体活动场所，建筑本身反映了文革特殊历史时期的典型风格，具有较高的历史和文物价值。</p>
