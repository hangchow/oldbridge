<h2>简介</h2><p>东荷村礼堂位于嘉兴市秀洲区王江泾镇东荷行政村12组。据村民介绍该礼堂为1971年建造（1972年完工），钢筋混凝土梁架，总占地面积约358平方米，北为礼堂，南为大队办公室（二层楼房），顶为8拱并列式梁，梁间隔3米。该礼堂当时是村生产队集体活动场所，建筑本身反映了文革特殊历史时期的典型风格，具有较高的历史和文物价值。</p>
