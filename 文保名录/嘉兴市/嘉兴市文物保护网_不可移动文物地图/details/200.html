<h2>简介</h2><p>项家厍沈氏民居位于嘉兴市秀洲区王江泾镇大坝村1组,据形制和所有人介绍，判断建于20世纪50年代，原布局不明，坐北朝南,砖木结构，穿枋式五檩，现存西侧半间平房，建筑占地面积约50平方米，进深8.13米，面阔7米,层高4.55米。地面青砖铺设，屋顶为青瓦砌成硬山顶，两端翘脊。该民居融合苏浙建筑风格，具有一定的历史和艺术价值。</p>
