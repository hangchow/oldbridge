<h2>简介</h2><p>石岸头王氏民居位于嘉兴市南湖区凤桥镇新篁社区石岸头5号，据屋主介绍和其形制，推断该民宅建于20世纪50年代初。一进四开间，共两层楼。一层为砖墙，二层为木结构，屋顶为硬山顶。面阔15米，进深4.5米，占地面积67.5平方米，檐高4.66米。周边房屋为近现代所造。<br>该民居连同石岸头石板路均体现了江南古镇的风貌，对研究民间建筑特色有一定的价值。</p>
