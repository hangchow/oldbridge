<h2>简介</h2><p>蒋庵遗址位于嘉兴市胥山村25组（原卫国村）,嘉善大道北面，为新石器良渚文化至春秋战国时期的遗址。面积约3000平方米，地势较低，因农田建设破坏严重。文化层厚约70至80厘米。1983年普查时出土较多陶器及一些石器，陶片标本有灰黑陶罐，夹砂印纹陶罐、器盖组等，石器有石钵、石镰等。蒋庵遗址1992年8月公布为市级文保点，有一定的历史文物价值和科学价值。</p>
