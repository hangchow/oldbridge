<h2>简介</h2><p>后埭梅氏民居位于嘉兴市秀洲区油车港镇百花庄村后埭16号，据建筑形制和屋主介绍，判断建于民国初年。该屋原布局不明，现存一进平房及二进局部，砖木结构，悬山顶。第一进五开间，穿斗式五檩，屋脊上有飞瓴，地面青砖局部保留，明间尚存部分神龛。第二进明间局部保存，其余拆毁。建筑局部有雕花。此民居建筑造型特殊，是苏南和浙北地区建筑风格的融合，具一定的历史价值。</p>
