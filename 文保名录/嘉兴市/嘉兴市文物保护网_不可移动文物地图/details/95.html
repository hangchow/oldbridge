<h2>简介</h2><p>朱家浜仁美桥位于嘉兴市南湖区凤桥镇茜柳村朱家浜11组，单孔梁式墩砌石板桥。根据其形制推断为清代。桥南北向横跨在朱家浜上，桥全长16.2米，宽1.3米，矢高3米。桥面由2块长条石铺设，两侧桥额刻有“仁美桥”和卷云纹，共有4个天磐石，无楹联。该桥是村中重要的历史建筑，有江南古桥梁的建筑特色，具有历史和科学价值。</p>
