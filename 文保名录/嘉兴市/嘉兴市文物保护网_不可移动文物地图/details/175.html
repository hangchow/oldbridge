<h2>来源所列等级</h2><p>文保点</p>

<h2>简介</h2><p>大坟遗址位于嘉兴市南湖区大桥镇江南村6组，西北环河，为新石器良渚文化至春秋战国时期的遗址。面积较小，仅7分地。1985年调查时在东南高地曾出土镂孔豆，贯耳壶等。文化层较厚，属良渚文化时期。西北高地文化层土色黑灰，厚约40厘米左右，出土较多的印纹陶片。大坟遗址1992年8月公布为市级文保点。遗址反映了良渚时期至春秋战国时的面貌，有较高的历史科学价值。</p>
