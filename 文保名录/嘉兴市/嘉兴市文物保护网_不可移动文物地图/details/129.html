<h2>地址</h2><p>凤桥镇星火村</p>
<h2>来源所列等级</h2><p>尚未核定为保护单位</p>
<h2>类别</h2><p>桥涵码头</p>
<h2>简介</h2><p>星火村遇龙桥位于星火村12组，据桥体铭文所载，该桥为清乾隆41年立，光绪11年重建。南北横跨河道，为单孔石板桥，全长约17米，桥面由三块石板铺成宽1.48米，跨度为5.2米，南北落坡各有7级石阶，略呈喇叭状。东西桥首均刻有“重建遇龙桥”额，其两边刻有小字，大致北为“乾隆四十一年杏月立”，南为“光绪十一年乙酉仲冬”。此桥有明确纪年，具有较高的历史价值。</p>
