<h2>简介</h2><p>双魁巷石埠头群位于嘉兴市南湖区解放街道航明社区鉏家滩，双魁巷东侧，建于民国时期。石埠头从北向南分布在一条长约110米的街道东侧，沿河共有9个河埠头，距水面1.05米，为双向踏步台阶，台阶上刻有水波纹。嘉兴市区现存这类石埠头群已极少见，它反映了江南临水建屋的风格，对研究当地居民的日常起居具有一定的意义。</p>
