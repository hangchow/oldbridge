<h1>双桥遗址</h1>
<p><a href="https://www.jxwwbh.cn/ShowDetail.aspx?wwid=265">原始详情页</a></p>
<h2>地址</h2><p>王江泾镇双桥村</p>
<h2>来源所列等级</h2><p>省级文物保护单位</p>
<h2>类别</h2><p>聚落址</p>
<h2>简介</h2><p>双桥遗址地处浙江省嘉兴市秀洲区王江泾镇双桥村，标志牌位于双桥小学内，整个双桥周围及原苏嘉公路两侧均有文化层分布，面积约为11000平方米。据以前的调查，其年代从新石器时代良渚文化一直延伸到春秋战国。现遗址地面上都为建筑物和操场，地面未采集到陶片。1981年公布为市级文保单位，具有很高的历史价值。</p>
<h2>保护范围</h2><p>以双桥小学围墙为界。</p>
<h2>建设控制地带</h2><p>四周距保护范围线30米。</p>
