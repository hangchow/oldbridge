<h2>简介</h2><p>栖柽村聚顺桥位于嘉兴市南湖区凤桥镇栖柽村23组，南北向横跨汤同港。三孔无栏梁式石板桥，全长18.5米，宽1.6米，高2.1米。此桥不见于地方志，始建年代不详，桥额旁亦看不清重建年份，根据其形制推断为清代时桥梁。桥面由3块长条石分三节组成，桥额刻有“重建聚顺桥”字样，并饰有卷草纹，无桥联。该桥对研究古桥梁的建造提供了实例，具有历史价值。</p>
