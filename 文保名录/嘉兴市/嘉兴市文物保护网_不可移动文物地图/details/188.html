<h2>简介</h2><p>东进村观音桥位于七星镇东进村陆家桥5组，当地村民又叫其陆家桥，根据形制推断为民国年间建造。东西跨河港，为单孔无栏梁式石板桥。桥面由三块石板组成。桥长13.8米，宽1.9米，桥面距水面2.9米。东西各有13级和11级台阶，有四个天磐石，桥额有“重建观音桥”，纹饰模糊。观音桥为过去东进村民的重要交通工具，有一定的历史、艺术价值。</p>
