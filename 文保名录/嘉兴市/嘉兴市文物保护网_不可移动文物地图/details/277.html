<h2>简介</h2><p>一里街碉堡位于嘉兴市秀洲区江泾镇王闻川社区一里街西端，南临市河，是日军在本地留下的抗日战争时期的军事建筑。呈圆柱形，外墙用青砖砌成，朝西北侧处上下各设有4个枪眼，枪眼口内小外大，呈喇叭型。碉堡外径4米，内径3米，高5.4米。该碉堡是王江泾镇上的历史建筑物之一，在当地居民中有较大的影响，具有一定的时代特征，对研究本地区的近现代发展有一定的意义。</p>
