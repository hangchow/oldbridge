<h2>简介</h2><p>吴氏民居位于嘉兴市秀洲区王江泾镇双桥村味达港，坐西朝东，砖木结构，为二层二开间楼房。建造年代不详，根据村民的介绍和其建筑形制，推断为清至民国时建。南侧墙面嵌有一石库门，二层东侧有扶手板。由于屋内没人，内部结构不详。面阔7.12米，进深4.81米，檐高5.63米。吴氏民居具有江南地区的典型建筑风格，对研究当地的民居建筑有一定的意义。</p>
