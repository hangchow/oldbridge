<h2>简介</h2><p>韩家浜遗址位于嘉兴市南湖区新丰镇竹林村幼儿园内及周边。该遗址原面积80000平方米（800×100）分布在水田和高地中，因新建民房，经常动土，遗址破坏日益严重，现存面积3600平方米。该遗址曾出土陶器以泥质黑陶、灰陶为主，采集标本器有：壶、豆、鼎、镂空豆把、双鼻圈足壶、提梁壶等，石器有石斧等完整器数件。1992年8月该遗址公布为文保点。</p>
