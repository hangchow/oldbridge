<h2>简介</h2><p>孙家汇遗存位于嘉兴市秀洲区王江泾镇范滩村6组，呈“凹”字型，面积约有2亩地。高墩高出于田地约7米，为新石器时代至春秋战国时期的遗址。由于上世纪70年代中期，砖厂大量取土，遗址形成南高北低的坡度。1992年公布为嘉兴市级文保点。该遗址年代久远，对研究古代村民的生活起居习俗提供了实物资料，具有较高的历史文物价值。</p>
