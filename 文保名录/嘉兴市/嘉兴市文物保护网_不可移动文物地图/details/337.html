<h2>简介</h2><p>西南大街屠式民居位于浙江省嘉兴市秀洲区新塍镇西南大街268-272号。据建筑形制和屋主介绍，判断建于民国时期。坐北朝南，北临市河，为三开间二层楼房，砖木结构，五檩，梁架有简单纹饰。通面阔10.78米，通进深9.13米。原为屠家所有，现三开间分别为三户人家所有。该民居为新塍镇上的历史建筑之一，历史悠久，造型古朴，对研究当地文化历史有一定价值。</p>
