<h2>简介</h2><p>茜柳村支家桥位于浙江省南湖区凤桥镇茜柳村14组, 三孔无栏梁式石板桥。南北向横跨在支家桥港上，全长18.55米，宽2.26米，高2.45米。桥始建年代不详，根据其形制推断为民国时期的桥梁。桥柱由3块条石竖置组成桥壁，有4个天盘石。不见桥额，无楹联。南、北两侧台阶尚在，其上铺筑水泥坡度。该桥在当地有一定的影响，历史悠久，具有历史价值。</p>
