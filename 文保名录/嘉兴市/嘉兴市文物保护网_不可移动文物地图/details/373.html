<h2>简介</h2><p>复兴桥位于浙江省嘉兴市秀洲区新塍镇洛兴村5组，南北走向，系三孔梁式平板石桥。始建年代，重建于民国三年（1914）。桥面为三块天石板平铺分三节而成，南北两侧各有台阶12级。东西桥额刻有“复兴桥”和“民国三年”字样，无纹饰。桥长30.8米，，桥宽1.5米，矢高1.85m。该桥造型古朴、简洁，对研究本地区古桥梁的构造有一定的参考价值。</p>
