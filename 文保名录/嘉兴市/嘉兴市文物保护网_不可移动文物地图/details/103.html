<h2>简介</h2><p>三星村西河桥位于嘉兴市南湖区凤桥镇三星村14组，原庄桥村4组。据形制和村民介绍判断为清建，为三孔无栏梁式石板桥。南北横跨西河桥港，桥全长26.78米，桥面宽1.3米由三块石板组成，桥底距水面高度为2.4米，无栏板，南北落坡与道路平行，无石阶。该桥历史悠久，是当地重要历史建筑，曾是陆上交通要道，具有一定历史和科学价值。</p>
