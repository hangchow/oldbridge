<h2>简介</h2><p>塘浜莫家民居位于嘉兴市秀洲区王江泾镇洪典村7组塘浜。据形制可知为民国时建筑。坐北朝南，为一进三开间平房，砖木结构，硬山顶，为抬梁和穿枋式并用，五檩，地面铺设青砖。通面阔12.15米，通进深8.2米，檐高2.2米。东西两侧设有厢房，朝南正门门楣上有雕花。此屋构造简朴，有一定传统民居的特色，具有一定历史的文物价值。</p>
