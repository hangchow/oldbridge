<h2>简介</h2><p>张家桥盛氏民居位于嘉兴市南湖区凤桥镇大星村1组，原张家桥自然村内，分布面积116余平方米。此宅为1958年在老宅基础上翻建，穿枋式梁架结构平房，坐北朝南，原为一进三开间，后于西间南面搭出一间。进深6米余，开间3.5米。此民居为江南风格的民居，由于经济发展迅速，在当地已很少见，具有较高的保存价值。</p>
