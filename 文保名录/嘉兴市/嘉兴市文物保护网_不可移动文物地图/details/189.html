<h2>简介</h2><p>七星村万兴桥位于嘉兴市南湖区七星镇七星村栅口自然村，俗称“铁店桥”。南北跨桥埭港，据桥体形制和周边村民介绍判断为清至民国时修建，全长20.99米，宽2.1米由三块石板，桥底距水面2.7米。南侧有8级台阶，北侧有6级台阶。东西有“重建万兴桥”额，下有桥联（但模糊无法辨识），有蟠螭等纹。该桥形制较大，保存较好，具有较高的历史价值。</p>
