<h2>简介</h2><p>大洋浜坟桥位于嘉兴市南湖区新丰镇杨庄村大洋浜自然村，清光绪建。南北跨九曲湾，全长23.1米，桥面宽1.1米由两块石板组成，桥底距水面高度2.4米、净跨12米，两岸桥堍用水泥板代替直接与两岸道路相连，东西桥额“屠坟桥”、旁镌小字“清光绪乙丑夏”、“里人公立”，有桥联（不便辨识），桥身有蟠螭，莲花等纹饰。该桥形制较大，保存较完整，具有较高历史和文物价值。</p>
