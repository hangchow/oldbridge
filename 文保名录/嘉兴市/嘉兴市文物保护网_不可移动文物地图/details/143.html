<h2>简介</h2><p>黄姑庵遗址位于嘉兴市南湖区余新镇金星村9组。东面和南面临河，中间有一条乡村道路。遗址东西长约60米，南北长约100米。遗址南侧有一高墩，高约1米，面积为360平方米，其上种桑树和建造房子。遗址其他地方多处造房子。据出土文物，黄姑庵遗址为新石器良渚文化至春秋战国时期的遗址。于1992年8月公布为市级文保点，规模较大，延续时间长，有很高的历史、科学价值。</p>
