<h2>简介</h2><p>利民村陆氏民居位于南湖区凤桥镇利民村，原石佛寺自然村内，据形制和住户介绍判断为民国时期建造，建筑占地面积60余平方米，为二层木梁架楼房，坐北朝南，二进，五柱五檩穿枋式，二开间，开间3.5米，一进深5米余；二进深4米余。此民居为江南风格的民居，由于经济发展迅速，在当地已很少见，具有历史价值。</p>
