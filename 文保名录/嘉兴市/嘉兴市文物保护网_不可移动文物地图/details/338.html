<h2>简介</h2><p>西南大街许氏民居位于浙江省嘉兴市秀洲区新塍镇西南大街287号。据房屋形制判断为民国时期建筑。坐北朝南，共三进八开间，前两进为楼房，第三进为平房，砖木结构，硬山顶，通面阔27米，通进深34米，无法进入院内查看内部结构。曾为供销社西生产部。许氏民居是西南大街上的历史建筑之一，有一定的历史和艺术价值。</p>
