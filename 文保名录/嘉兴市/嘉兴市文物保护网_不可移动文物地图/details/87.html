<h2>简介</h2><p>联丰村小马鸣桥位于嘉兴市凤桥镇联丰村3、4组之间。东西向跨马鸣桥港，单孔无栏石板桥。桥始建年代不详，根据桥额“民国□□□”可知为民国时期建造。桥全长12.15米，宽1.65米，桥距水面高2.5米。桥面由3块条石分三节平铺而成，南北桥额刻有“马鸣桥”、“民国□□□”，无楹联。该桥是当地的历史建筑物之一，造型简朴，具有一定的历史和科学价值。</p>
