<h2>简介</h2><p>万寿桥位于浙江省嘉兴市秀洲区新塍镇洛西村25组（小地名红灯浜），从桥额文字可知于清宣统二年重建，南北向跨红灯浜，为单孔无栏石拱桥，南北向横跨红灯浜，桥额刻有“万寿桥”和“宣统二年”。共四个天磐石。桥长15米，宽2米，圆拱跨度4米，矢高2.5米，两桥堍各有跨步台阶14级。万寿桥年代较早，保存较好，造型美观，有一定的历史艺术价值。</p>
