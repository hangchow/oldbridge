<h2>简介</h2><p>张绍忠（1896～1947），嘉兴人，著名物理学家、教育家，中国物理学会早期领导人之一，我国最早从事高压物理研究的物理学家之一，毕生献身于教育事业，创办了浙江大学物理系。其旧居位于油车港镇马厍村150号，清代建筑，坐北朝南，中间为主楼，两侧为厢房，建筑面积205平方米。2012年，旧居公布为市级文物保护点。2015，旧居完成修缮布展对外免费开放。</p>
