<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>康和桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>康和桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8005">原文</a></p><p style="text-align: center"><img src="../assets/b62e622c2a61a3713ff4.jpg" title="康和桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;康和桥位于嘉兴市秀洲区新塍镇康和桥村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1</span><span style="font-size:14px;font-family:宋体">组。据桥的形制和当地村民的介绍，综合判断为清代建造。传说康王曾来过此地，百姓把桥取名为康和桥。南北横跨康和桥港，系五孔无栏梁式石板桥。桥长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">25.5</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，桥面宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.6</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，桥面和桥柱均由</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3</span><span style="font-size:14px;font-family:宋体">块石板组成。桥底距水面高度</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.35</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">。南北桥堍各设石阶</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">6</span><span style="font-size:14px;font-family:宋体">级。桥额刻“重建康和桥”，桥身刻有卷草等纹饰。此桥曾处在重要的水上交通要道上，民间传说丰富，桥规模较大，做工考究，在当地古桥中属精品，具有较高的历史和艺术价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2009</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
