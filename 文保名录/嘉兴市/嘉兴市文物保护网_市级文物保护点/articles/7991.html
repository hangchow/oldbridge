<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>朱大栩老宅</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>朱大栩老宅</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7991">原文</a></p><p><span style="font-size:14px;font-family:宋体"></span></p><p style="text-align: left;"><span style="font-size: 14px; font-family: 宋体;"></span></p><p style="text-align: center"><img src="../assets/5bf45012083099875ed0.jpg" title="朱大栩老宅砖雕门楼.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="text-align: left;"><span style="font-size: 14px; font-family: 宋体;"></span><br/></p><p style="text-align: left; line-height: 2em;"><span style="font-size: 14px; font-family: 宋体;">朱大栩老宅位于嘉兴市秀洲区新塍镇秀水社区西北大街</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">168</span><span style="font-size: 14px; font-family: 宋体;">号。据屋主介绍为清同治年间建造，原住户经营丝绸生意，土改后房子被政府分给无房户居住。坐北朝南，占地面积</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">589</span><span style="font-size: 14px; font-family: 宋体;">平方米，通面阔</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">12</span><span style="font-size: 14px; font-family: 宋体;">米，通进深</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">43</span><span style="font-size: 14px; font-family: 宋体;">米。原为四进，现一进已毁，仅存后三进。二进前天井处有砖雕门楼，砖雕工艺精美，雕福禄寿等纹饰。屋顶为硬山顶，有马头墙，抬梁式五架梁，有冬瓜梁，梁架用料粗大，梁上及门窗等处有细致雕工。老宅门楼保存完整，砖雕工艺精美，在嘉兴现存门楼中是难得的精品，具有较高的历史和艺术价值。</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">2002</span><span style="font-size: 14px; font-family: 宋体;">年公布为嘉兴市文物保护点。</span><br/></p></html>
