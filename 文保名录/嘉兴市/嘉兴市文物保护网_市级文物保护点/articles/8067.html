<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>五圣浜遗存</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>五圣浜遗存</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8067">原文</a></p><p style="text-align: center"><img src="../assets/3f4e9b21662179b1387a.jpg" title="五圣浜遗存近景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;五圣浜遗存位于嘉兴市南湖区大桥镇胥山村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">28</span><span style="font-size:14px;font-family:宋体">组，遗址平面呈不规则梯形，面积较大，占地约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">10000</span><span style="font-size:14px;font-family:宋体">平方米，高出四面水田</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">0.4</span><span style="font-size:14px;font-family:宋体">至</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.8</span><span style="font-size:14px;font-family:宋体">米。农田开挖沟渠时发现陶片，表面可采集到印纹陶片，有长方格纹、回纹等，还有丁字形鼎足，凹凿形鼎足及黑皮陶壶残片等。该遗存较好的反映了新石器时代崧泽、良渚至马桥时期的文化面貌，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2002</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
