<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>蒋庵遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>蒋庵遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8066">原文</a></p><p style="text-align: center"><img src="../assets/9b827023cd808a04bea8.jpg" title="蒋庵遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;蒋庵遗址位于嘉兴市南湖区大桥镇胥山村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">25</span><span style="font-size:14px;font-family:宋体">组（原卫国村），嘉善大道北面，面积约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3000</span><span style="font-size:14px;font-family:宋体">平方米，为新石器时代良渚文化至春秋战国时期的遗址。遗址地势较低，因农田建设破坏严重。文化层厚约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">70</span><span style="font-size:14px;font-family:宋体">至</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">80</span><span style="font-size:14px;font-family:宋体">厘米。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1983</span><span style="font-size:14px;font-family:宋体">年二普时出土较多陶器及一些石器，陶片标本有灰黑陶罐，夹砂印纹陶罐、器盖组等，石器有石钵、石镰等。遗址反映了良渚时期至春秋战国时的面貌，延续时间较长，有较高的历史、科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布嘉兴市文物保护点。</span></p></html>
