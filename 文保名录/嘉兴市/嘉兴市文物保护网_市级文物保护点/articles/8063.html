<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>周家湾遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>周家湾遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8063">原文</a></p><p style="text-align: center"><img src="../assets/5eb950cdbad9d9577a04.jpg" title="周家湾遗址远景1.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;周家湾遗址位于嘉兴市南湖区大桥镇建国村周家湾自然村，东面紧靠何家塘河港，南、北、西三面与农田相连，面积约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">20000</span><span style="font-size:14px;font-family:宋体">平方米，为新石器时代良渚文化晚期至春秋战国时期的古文化遗存。遗址分布在农田内，河港东西向流过，地势略低凹。出土陶片较多，还有石器发现。从陶片标本分析，以春秋战国时期印纹陶为主，其次为新石器时代良渚文化陶器。遗址具一定规模，延续时间较长，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
