<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>建设村冯氏民宅</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>建设村冯氏民宅</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-06 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8058">原文</a></p><p style="text-align: center"><img src="../assets/4321316ecc9e9ab0a5a8.jpg" title="建设村冯氏民宅外景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 建设村冯氏民宅位于嘉兴市秀洲区王店镇建设村</span>13组三家村北22号。据形制判断为民国时期建筑，现作为堆放草料的仓库。坐北朝南，为一进五开间平房，占地面积200平方米，面阔20.96米，进深9.52米，顶高5.13米。硬山顶，屋顶铺设望板，抬梁式九檩，前后各三步，用四柱。雀替为素面，排门内侧雕花，外为素面。东侧另新搭建一开间。建设村冯氏民宅</span><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">形制规矩，做工考究，木构件保存完整，具有较高的历史和科学价值。</span>2010<span style="font-family:宋体">年公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
