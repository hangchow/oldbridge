<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>沈庄桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>沈庄桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8094">原文</a></p><p style="text-align: center"><img src="../assets/aa8e7f1ce5ba6ea8cc77.jpg" title="沈庄桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;沈庄桥位于嘉兴市南湖区新丰镇金章村李家头自然村与平湖曹桥街道愚桥村交界处。据形制和周边村民了解为清代建造，为单孔无栏石拱桥。东西向跨沈庄桥港，全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">33.3</span><span style="font-size:14px;font-family:宋体">米，桥面宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.4</span><span style="font-size:14px;font-family:宋体">米，拱跨</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">9.6</span><span style="font-size:14px;font-family:宋体">米，河面净跨</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">30</span><span style="font-size:14px;font-family:宋体">米，矢高</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">4.5</span><span style="font-size:14px;font-family:宋体">米，顶盘石边长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.2</span><span style="font-size:14px;font-family:宋体">米。因桥身布满植物藤蔓，桥额、联及纹饰无法辨认。该桥规模很大，在嘉兴地区不多见，具有较高的历史价值和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为市级文保点。</span></p></html>
