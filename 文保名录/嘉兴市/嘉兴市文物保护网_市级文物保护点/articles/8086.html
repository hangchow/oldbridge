<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>凤桥徐可老宅</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>凤桥徐可老宅</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8086">原文</a></p><p style="text-align: center"><img src="../assets/ba02431b49e8f9233f3a.jpg" title="凤桥徐可老宅西立面.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;凤桥徐可老宅位于嘉兴市南湖区凤桥镇利民社区小五房</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">13</span><span style="font-size:14px;font-family:宋体">号，据形制和所有人介绍判断为清建。原有布局不明（所有人说五进），现存二进和东侧走马堂楼。南一进为一层平房，二、四进位二层楼房，二进西侧原挖有人工湖（现已填平），临湖修建重檐庑殿顶半间房，三进已改建新房。建筑均为砖木结构，梁架穿斗式，屋顶大部分为硬山顶，做工较精，梁枋、牛腿、雀替等处雕工较细致，建筑规模较大。老宅具有典型的传统江南水乡建筑特点，为研究当时当地民众的生产生活提供了很好的见证，具有较高的历史和艺术价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为市级文物保护点。</span></p></html>
