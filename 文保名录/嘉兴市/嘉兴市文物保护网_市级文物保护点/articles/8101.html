<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>砖桥街民国消防所旧址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>砖桥街民国消防所旧址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8101">原文</a></p><p style="text-align: center"><img src="../assets/332c9a46003f291ef5fa.jpg" title="砖桥街民国消防所旧址远景2.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 砖桥街民国消防所旧址位于嘉兴市南湖区建设街道砖桥街</span>181<span style="font-family:宋体">号，又名南区龙会，为民国时期的消防人员驻地。一层平房，总建筑占地面积约</span><span style="font-family:Times New Roman">180</span><span style="font-family:宋体">平方米。东西长</span><span style="font-family:Times New Roman">17.51</span><span style="font-family:宋体">米，南北宽</span><span style="font-family:Times New Roman">10.25</span><span style="font-family:宋体">米。全部建筑由小青砖构筑，门窗为西洋式拱顶，屋顶为硬山顶。西山墙上有“南区龙会”四个大字，内部设备亦无存。砖桥街民国消防所旧址作为传统消防建筑在嘉兴保存较少，对于研究嘉兴城市功能的演变发展、市民传统生活，我国的消防发展史都有较高的历史和科学价值。</span><span style="font-family:Times New Roman">2009</span><span style="font-family:宋体">年公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
