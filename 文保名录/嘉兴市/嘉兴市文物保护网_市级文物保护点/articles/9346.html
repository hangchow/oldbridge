<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>绕坟桥遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>绕坟桥遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2022-05-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=9346">原文</a></p><p style="text-align: center; line-height: 3em;">&nbsp;&nbsp;&nbsp;&nbsp;<img src="../assets/baf0d28bfd36272af3bd.jpg" title="1、绕坟桥遗址俯拍照（东南向西北摄）.jpg" width="600" height="337" border="0" hspace="0" vspace="0" style="width: 600px; height: 337px;"/></p><p style="line-height: 2em;"><span style="font-family: 宋体; text-indent: 32px; font-size: 14px;">&nbsp; 绕坟桥遗址位于秀洲区王店镇建林村绕坟桥西侧，系新石器时代晚期至春秋战国时期遗址。2020年发现，面积约1万平方米，现存地面高出水稻田约1米。遗址北部高墩地表散落大量泥质红陶片、灰陶片。高墩周边区域地表采集到良渚文化陶片及历史时期陶瓷片等物，发现1.2米厚度以上的文化层。该遗址保存面积较大，高墩保存较完整，具有很高的历史价值。2021年被公布为嘉兴市文物保护点。</span></p></html>
