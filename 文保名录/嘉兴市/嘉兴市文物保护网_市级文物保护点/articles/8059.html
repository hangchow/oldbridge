<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>红联村大桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>红联村大桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-06 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8059">原文</a></p><p style="text-align: center"><img src="../assets/b8c4e7a11efb7109cb19.jpg" title="红联村大桥近景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 红联村大桥位于嘉兴市秀洲区王店镇红联村</span>22、23组，据村民回忆及桥的形制判断建筑年代为民国。南北向跨大桥港，系三孔梁式砖桥，桥全长21.3米，宽2.15米，桥底据水面高度3.3米。桥柱由两块石板组成桥身底部铺木梁，梁上竖铺小青砖，东西落坡各设石阶7级。红联村大桥以木梁和石柱为基础，辅以青砖的桥梁形制在嘉兴较为少见，为研究古桥建筑史提供了实证，具有较高的科学和历史价值。2009年公布嘉兴市文物保护点。</span></p><p><br/></p></html>
