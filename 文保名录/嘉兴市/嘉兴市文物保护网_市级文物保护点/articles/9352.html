<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>张恒昌酱园旧址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>张恒昌酱园旧址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2022-05-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=9352">原文</a></p><p style="text-align: center; line-height: 2em;"><img src="../assets/e1bedc6d64bf0906e2a5.jpg" title="2、张恒昌酱园旧址屋顶及风火墙.JPG" width="600" height="397" border="0" hspace="0" vspace="0" style="width: 600px; height: 397px;"/></p><p style="text-indent: 32px; line-height: 2em;"><span style=";font-family:宋体;font-size:16px"><span style="font-family: 宋体, SimSun; font-size: 14px;">张恒昌酱园旧址位于秀洲区新塍镇西北大街156号，建于清至民国时期。原为张恒昌酱园，建国后分给无房户居住。坐北朝南，原有格局不明，现仅存一进二层楼房及前后院，占地面积184.8平方米。通面阔8.8米，前院进深4.68米，楼房进深10.36米，后院进深5.76米。院风火墙东西有观音兜。老作坊作为传统社会老百姓日常生活的一部分，是研究地方社会史、民俗史的珍贵实物资料，目前在嘉兴的存世量较少，因此该旧址具有很高的历史和科学价值。2021年被公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
