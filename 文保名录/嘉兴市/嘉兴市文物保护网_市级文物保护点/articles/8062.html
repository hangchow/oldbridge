<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>黄姑庵遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>黄姑庵遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8062">原文</a></p><p style="text-align: center"><img src="../assets/198a4219ff7b949fc4e1.jpg" title="黄姑庵遗址远景1.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;黄姑庵遗址位于嘉兴市南湖区余新镇金星村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">9</span><span style="font-size:14px;font-family:宋体">组。东面和南面临河，中间有一条乡村道路。遗址占地面积</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">6000</span><span style="font-size:14px;font-family:宋体">平方米，东西约</span><span style="font-size:14px;font-family: &#39;Times New Roman&#39;,&#39;serif&#39;">60</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，南北约</span><span style="font-size:14px;font-family: &#39;Times New Roman&#39;,&#39;serif&#39;">100</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">。遗址南侧有一高墩，高约</span><span style="font-size:14px;font-family: &#39;Times New Roman&#39;,&#39;serif&#39;">1</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，面积为</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">360</span><span style="font-size:14px;font-family:宋体">平方米，其上种桑树和建造房子，遗址其余地方也多处造有房子。据出土文物分析，黄姑庵遗址为新石器良渚文化至春秋战国时期的遗址。遗址具有一定规模，延续时间长，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
