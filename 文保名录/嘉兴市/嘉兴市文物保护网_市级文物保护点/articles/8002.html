<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>多嫁桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>多嫁桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8002">原文</a></p><p style="text-align: center"><img src="../assets/314761cb3ac37e9a126d.jpg" title="多嫁桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<br/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;多嫁桥位于嘉兴市秀州区新塍镇观音桥村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3</span><span style="font-size:14px;font-family:宋体">组与南洋村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">16</span><span style="font-size:14px;font-family:宋体">组交界处。始建年代不详，据其形制和当地村民介绍，综合推断为清时重建。东西跨多稼桥港，系三孔无栏梁式石板桥，桥全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">14</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，桥宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.14</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，桥面和桥柱均由</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">4</span><span style="font-size:14px;font-family:宋体">块石板组成，桥底距水面</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.48</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，桥额刻“多稼桥”，有桥联（因水深无法辨识），桥身刻有蟠螭纹、莲纹。东西落坡无存，直接与两岸道路相接。此桥曾处在重要的水上交通要道上，是当地重要的历史建筑，做工考究，保存较好，具有较高的历史价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
