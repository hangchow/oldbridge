<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>横港张镜荣老宅</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>横港张镜荣老宅</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-06 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8027">原文</a></p><p style="line-height: 2em; text-align: center;"><span style="font-family: 宋体; font-size: 14px;"></span><img src="../assets/feab0112dc167ce578c9.jpg" title="横港张镜荣老宅外景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="text-align: center; width: 551px; height: 365px;"/></p><p><br/></p><p style="text-align: center;"><img src="../assets/60edffcf90809953153f.jpg" style="width: 551px; height: 365px;" title="横港张镜荣老宅内景.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="line-height: 2em;"><span style="font-family: 宋体; font-size: 14px;"></span></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 横港张镜荣老宅位于嘉兴市秀洲区王江泾镇红联村</span>5组，据住户介绍该建筑为民国所建。坐北朝南，木梁架结构，呈四合式建筑，原为三进，现存二进穿枋式五檩平房，总占地面积约169平方米，第一进中为门道、两侧为次间，中为天井，地面用小青砖铺设，两侧各有厢房（东侧一间已拆除做鸡舍）；第二进为三开间。该宅门罩等处局部雕刻，屋顶为硬山顶，两端翘脊，用料一般。该宅具有江南民居特色，虽然保存情况不好，但仍具一定的历史价值。2010年公布为嘉兴市文物保护点。</span></p><p style="line-height: 2em;"><br/></p></html>
