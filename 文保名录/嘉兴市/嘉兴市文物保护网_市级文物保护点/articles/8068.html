<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>泥桥遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>泥桥遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8068">原文</a></p><p style="text-align: center"><img src="../assets/6bec804b30922c2d8272.jpg" title="泥桥遗址远景1.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;泥桥遗址位于嘉兴市南湖区新丰镇净湘村泥桥组，西边环河，东为新盐丰公路，原老盐丰公路穿过泥桥。总面积约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">6</span><span style="font-size:14px;font-family:宋体">万平方米，文化层厚</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">0.5</span><span style="font-size:14px;font-family:宋体">至</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.0</span><span style="font-size:14px;font-family:宋体">米。据过去调查资料该遗址时期为春秋战国，曾出土席纹、细方格纹、半字纹等大量印纹陶片。现遗址表面以农作物，少量的民宅为主。保护牌在泥桥浜北面。泥桥遗址规模较大，延续时间长，是目前嘉兴市保存较完整的遗址之一，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
