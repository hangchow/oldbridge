<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>应家港遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>应家港遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7975">原文</a></p><p style="text-align: center"><img src="../assets/73f58bb2e184b45e15f4.jpg" title="应家港遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><span style="font-family: 宋体, SimSun; font-size: 14px;"><br/></span></p><p style="line-height: 2em;"><span style="font-family: 宋体, SimSun; font-size: 14px;">&nbsp;&nbsp;应家港遗址位于嘉兴市秀洲区油车港镇澄溪村</span><span style="font-family: 宋体, SimSun; font-size: 14px;">3</span><span style="font-family: 宋体, SimSun; font-size: 14px;">组，东南紧临油车港老镇，北面是红旗塘，东为南北向河。遗址地势低凹，分布在约</span><span style="font-family: 宋体, SimSun; font-size: 14px;">300</span><span style="font-family: 宋体, SimSun; font-size: 14px;">×</span><span style="font-family: 宋体, SimSun; font-size: 14px;">400</span><span style="font-family: 宋体, SimSun; font-size: 14px;">平方米的农田内，处于河港的包围之中。</span><span style="font-family: 宋体, SimSun; font-size: 14px;">1958</span><span style="font-family: 宋体, SimSun; font-size: 14px;">年左右开挖殷家港，出土了一些新石器时代器物，当时根据出土器物判断该遗址年代大致相当于新石器时代良渚文化至春秋战国时期。</span><span style="font-family: 宋体, SimSun; font-size: 14px;">1983</span><span style="font-family: 宋体, SimSun; font-size: 14px;">年二普时未见完整陶器及其他石器出土。本次普查也未在地面发现陶片及石器。高家汇遗址范围较大，延续时间长，有较高的历史和科学价值。</span><span style="font-family: 宋体, SimSun; font-size: 14px;">1992</span><span style="font-family: 宋体, SimSun; font-size: 14px;">年公布为嘉兴市文物保护点。</span><br/></p><p><br/></p></html>
