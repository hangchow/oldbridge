<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>半墩祠堂</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>半墩祠堂</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8081">原文</a></p><p style="text-align: center"><img src="../assets/4aef50265fdf9f71605b.jpg" title="半墩祠堂外景.jpg" width="551" height="414" border="0" hspace="0" vspace="0" style="width: 551px; height: 414px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;半墩祠堂位于嘉兴市南湖区东栅街道半墩村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">4</span><span style="font-size:14px;font-family:宋体">组，据建筑形制判断，祠堂为清至民国建造，占地面积</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">516</span><span style="font-size:14px;font-family:宋体">平方米，坐北朝南，原有两进，现仅存一进二层正厅及天井两侧厢房。用料粗大，做工较精。梁上有细致雕工，厢房尚存部分排窗，窗上雕有纹饰，墙体用青砖铺设，屋顶为硬山顶，正脊两端有飞瓴。目前祠堂建筑在嘉兴发现较少，在同类型建筑中半墩祠堂保存较好，具有较高的历史价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
