<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>双魁巷石埠头群</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>双魁巷石埠头群</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2022-05-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=9355">原文</a></p><p style="text-align: center; line-height: 2em;"><img src="../assets/16b105199476f8ea94b6.jpg" title="1、双魁巷石埠头群全景.JPG" width="600" height="397" border="0" hspace="0" vspace="0" style="width: 600px; height: 397px;"/></p><p style="text-indent: 32px; line-height: 2em;"><span style=";font-family:宋体;font-size:16px"><span style="font-family: 宋体, SimSun; font-size: 14px;">双魁巷石埠头群位于南湖区解放街道航明社区鉏家滩、双魁巷东侧，建于民国时期。石埠头共有9个，从北向南分布在一条长约110米的街道东侧，均为双向踏步台阶，台阶上刻有水波纹。该石埠头群反映了江南临水建屋的风格，对研究当地居民的日常起居具有一定的意义，目前同类建筑在嘉兴市区已极少见，因此具有较高的历史、科学和艺术价值。2021年被公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
