<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>大盐仓桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>大盐仓桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8109">原文</a></p><p style="text-align: center"><img src="../assets/0c8e4b66742f36b6f08f.jpg" title="大盐仓桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 大盐仓桥位于嘉兴市南湖区南湖街道南湖社区南湖路，南北向跨盐仓河，连接南湖路，是南湖边上的一座单孔石拱桥，因附近有盐仓而得名，桥始建年代不详，桥全长</span>20米，宽6.9米。桥拱由条石纵联并列分节砌筑，东西两侧各有望柱10根，当中四根望柱上立有灯柱，桥面用柏油铺平。桥额刻有：“大盐仓桥”和“一九五九年重建”，桥身无纹饰。大盐仓桥在嘉兴有一定知名度，造型别致，具有一定历史和科学价值。2010年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
