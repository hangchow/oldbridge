<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>洛东村喜阶桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>洛东村喜阶桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8007">原文</a></p><p style="text-align: center"><img src="../assets/5739d739caf9b5a02a47.jpg" title="洛东村喜阶桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;洛东村喜阶桥位于嘉兴市秀洲区新塍镇洛东村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3</span><span style="font-size:14px;font-family:宋体">组，从桥额小字知此桥建于清道光三年（</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1823</span><span style="font-size:14px;font-family:宋体">）。系三孔梁式石板桥，东西横跨喜阶桥港。桥全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">25</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.7</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，桥底距河面高度</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.57</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，桥面和桥柱均有</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3</span><span style="font-size:14px;font-family:宋体">块石板组成，东西落坡各设石阶</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">7</span><span style="font-size:14px;font-family:宋体">级，桥额刻有“喜阶桥”，旁镌“道光三年”小字，桥身饰有卷草等纹，南北桥楹联为：“东亩西畴群利涉，南墙北楫自安流，共仰福禄歌有庆，咸思善建乐维新”。喜阶桥纪年明确，保存较好，做工考究，具有较高的历史和艺术价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
