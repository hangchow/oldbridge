<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>泰石桥村拱顶储备粮仓</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>泰石桥村拱顶储备粮仓</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-06 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8060">原文</a></p><p style="text-align: center"><img src="../assets/92de6ea8a582898a8852.jpg" title="泰石桥村拱顶储备粮仓远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 泰石桥村拱顶储备粮仓位于嘉兴市秀洲区洪合镇泰石村</span>11组，据其形制判断，建于二十世纪六十年代，是村民自用的储备粮仓。坐北朝南，占地面积302平方米，面阔35.74米，进深8.45米，顶高5米。屋顶由10个拱顶连接而成，拱顶和柱子均用青砖砌成，无水泥、钢筋等材料。泰石桥村拱顶储备粮仓形制独特、是建国初期中苏友好的象征，在嘉兴地区较少见，对研究新中国初期的经济和社会具有较高的历史价值。2009年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
