<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>抗战碉堡群</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>抗战碉堡群</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2022-05-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=9359">原文</a></p><p style="text-align: center; line-height: 2em;"><img src="../assets/c6bacf7b6bc65f37d3b1.jpg" title="3、嘉兴东站西侧碉堡南立面.jpg" width="600" height="405" border="0" hspace="0" vspace="0" style="width: 600px; height: 405px;"/></p><p style="text-align: center; line-height: 3em;"><span style="font-family: 宋体, SimSun; font-size: 12px;">嘉兴东站碉堡</span></p><p style="line-height: 2em;"><span style="font-family: 宋体, SimSun; font-size: 14px;"></span></p><p style="text-align: center; line-height: 3em;"><img src="../assets/0f7297ad2767e0a95c13.jpg" title="5、香花坝桥碉堡进口（东南向西北摄）.JPG" width="600" height="397" border="0" hspace="0" vspace="0" style="width: 600px; height: 397px;"/></p><p style="text-align: center; line-height: 3em;"><span style="font-family: 宋体, SimSun; font-size: 12px;">香花坝桥碉堡</span><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:16px"><span style="font-family: 宋体, SimSun; font-size: 14px;">&nbsp; 抗战碉堡群含创业路碉堡、东塔路碉堡、嘉兴东站碉堡、八里村碉堡、香花坝桥碉堡、大珠楼碉堡及潘家头碉堡，位于南湖区解放街道、南湖街道、大桥镇和新丰镇，皆为抗日战争时期中国政府为抵御日军所建。均为半地下式，形制大体相同，平面略呈扇形，射击和观察口设在面向河道或铁路线一侧，便于监视和观察敌军动向，在淞沪会战期间对牵制日军进攻起到了重要作用。该碉堡群结构坚固，形制特殊，是日军侵华的铁证，具有较高的历史和科学价值。2021年被公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
