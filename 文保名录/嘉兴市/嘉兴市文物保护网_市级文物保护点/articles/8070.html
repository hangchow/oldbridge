<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>灶山坟遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>灶山坟遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8070">原文</a></p><p style="text-align: center"><img src="../assets/e092b18f0006c2eaa1b8.jpg" title="灶山坟遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;灶山坟遗址位于嘉兴市南湖区新丰镇永丰村陈家浜自然村，高墩范围现目测约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">10000</span><span style="font-size:14px;font-family:宋体">余平方米。据当地人周荣生回忆，</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2002</span><span style="font-size:14px;font-family:宋体">年其在此处挖出一石钺（据其描述石钺表面抛光处理疑为新石器时代良渚文化器物，</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2004</span><span style="font-size:14px;font-family:宋体">年被其以</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">50</span><span style="font-size:14px;font-family:宋体">元卖给文物贩子）并有大量夹砂红陶罐（器物丢弃）经普查队用洛阳铲打探洞</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2</span><span style="font-size:14px;font-family:宋体">处，深逾</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.2</span><span style="font-size:14px;font-family:宋体">米，采集到少量陶碎片，并发现文化层迹象，待与省考古所专家联系进一步核实遗址年代和范围。嘉兴新发现的遗址较少，灶山坟遗址属新石器时代良渚文化遗址，具有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2009</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
