<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>七星村万兴桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>七星村万兴桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8096">原文</a></p><p style="text-align: center"><img src="../assets/38559de6b7b13756c743.jpg" title="七星村万兴桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;七星村万兴桥位于嘉兴市南湖区七星镇七星村栅口自然村，俗称“铁店桥”。南北横跨桥埭港，据形制和周边村民介绍，判断为清至民国时修建，全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">20.99</span><span style="font-size:14px;font-family:宋体">米，宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.1</span><span style="font-size:14px;font-family:宋体">米，桥面和桥柱均由三块石板组成，桥底距水面</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.7</span><span style="font-size:14px;font-family:宋体">米。南北落坡各设石阶</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">8</span><span style="font-size:14px;font-family:宋体">级和</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">6</span><span style="font-size:14px;font-family:宋体">级。东西两侧刻有“重建万兴桥”额，下有桥联（但模糊无法辨识），桥身刻有卷草等纹饰。万兴桥体量较大，做工精美，保存较好，是当地仅有的古建筑之一，具有较高的历史和艺术价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
