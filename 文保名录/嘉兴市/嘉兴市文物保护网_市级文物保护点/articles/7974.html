<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>高家汇遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>高家汇遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7974">原文</a></p><p style="text-align: center"><img src="../assets/100dc7f71be547ee1270.jpg" style="width: 551px; height: 365px;" title="高家汇遗址远景1.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="text-align: center"><img src="../assets/8eb30d4750c65290b7fc.jpg" style="width: 551px; height: 365px;" title="高家汇遗址远景2.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="line-height: 2em;">&nbsp; &nbsp; &nbsp; <span style="font-size:14px;font-family:宋体">高家汇遗址位于嘉兴市秀洲区新塍镇西文桥村，原王安庄村，遗址东面临河，开挖河道，把遗址隔成南北两部分，面积约有</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">40000</span><span style="font-size:14px;font-family:宋体">平方米。根据调查资料记载，开挖河道时此处发现大量陶片，经专家鉴定，判断为新石器时代良渚文化至春秋战国时期的遗址。现遗址上建造大面积房屋，地上未采集到陶片。高家汇遗址范围较大，延续时间长，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
