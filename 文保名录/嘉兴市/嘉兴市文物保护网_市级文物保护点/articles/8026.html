<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小曲村小学校舍</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>小曲村小学校舍</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-06 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8026">原文</a></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体"></span></span></p><p style="text-align: center"><img src="../assets/367124b55873558676fe.jpg" title="小曲村小学校舍远景2.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: normal;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体"></span></span><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 小曲村小学校舍位于嘉兴市秀洲区王江泾镇华联行政村</span>7组属原小曲自然村，为一所20世纪50年代建造的不完全小学，只招收小学一到三年级学生。现存北侧、西侧教室各一间，整体呈“L”形分布，南面有一个小操场，东、南边有围墙环绕，建筑占地面积约800平方米，为水泥青砖建筑。作为新中国成立之初建造的村办小学，虽然建筑本身的价值不高，但其带有的历史痕迹，能够反映一个时代的历史和文化信息，因而具有较高的历史价值。2009年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
