<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>月河丰乐桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>月河丰乐桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8076">原文</a></p><p style="text-align: center"><img src="../assets/7fa30e966a051964e10e.jpg" title="月河丰乐桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;月河丰乐桥位于嘉兴市南湖区新嘉街道月河社区中基路西侧，同乐小区和清风阁小区交界处。据当地人讲，桥旁原有广庆（清）庵、关帝庙，均为清代同时期建筑，就此判断，桥年代至少为清代，系三孔无栏梁式石板桥，南北跨月河，桥面和桥柱由四块石板组成，具体尺寸由于不能通行现无法测量，东西有桥额“重建丰乐桥”，有桥联（由于风化和方位原因无法辨认）。北侧保留七级台阶，南侧已拆除。同类古桥在老城区已很少见，作为嘉兴历史的见证，具有较高历史价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
