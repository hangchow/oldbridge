<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>东马桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>东马桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8075">原文</a></p><p style="text-align: center"><img src="../assets/b265777e5e53ca316f22.jpg" title="东马桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;东马桥位于嘉兴市南湖区新嘉街道西马桥社区旁，东西横跨马桥港，为三孔无栏梁式石板，全长约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">21.3</span><span style="font-size:14px;font-family:宋体">米，桥面由</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3</span><span style="font-size:14px;font-family:宋体">块石板并列组成宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.63</span><span style="font-size:14px;font-family:宋体">米，桥底距水面高度</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.82</span><span style="font-size:14px;font-family:宋体">米，中孔跨度为</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">5.6</span><span style="font-size:14px;font-family:宋体">米，东西落坡石阶被水泥铺平。南北桥额刻“东马桥”和“光绪二十四年”，有桥联，北为“寒往暑来□□远处如走马，利人济物善缘积累江修桥”；南为“禾郡向南行丰稔必征动里得，□桥□北□富□都是俭中来”。东马桥是当地重要的历史建筑，虽保存一般，但全面反映了传统石板桥的风貌，具有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
