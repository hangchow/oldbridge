<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>陈家坝村陶家桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>陈家坝村陶家桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8013">原文</a></p><p style="text-align: center"><img src="../assets/30be4cfe110b8d565129.jpg" title="陈家坝村陶家桥近景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;陈家坝村陶家桥位于嘉兴市秀洲区油车港镇陈家坝村村委南侧。根据形制判断该桥为清代所建。南北横跨陶家桥港，系三孔有栏梁式石板桥，全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">21.57</span><span style="font-size:14px;font-family:宋体">米，宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.1</span><span style="font-size:14px;font-family:宋体">米桥面和桥柱均由</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">4</span><span style="font-size:14px;font-family:宋体">块石板组成，桥栏有狮子形望柱</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">4</span><span style="font-size:14px;font-family:宋体">根，南北落坡各设石阶</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">10</span><span style="font-size:14px;font-family:宋体">级，两侧桥额刻有“重建陶家桥”，东西桥联分别为：“桥有□建福庇临，秀水藏驚同欢歌”和“藏水南流紫秀水，福禄长临美有鱼”。桥身刻有花纹。陶家桥形制完整，狮子望柱雕刻栩栩如生，做工考究，有较高的历史和艺术价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2009</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
