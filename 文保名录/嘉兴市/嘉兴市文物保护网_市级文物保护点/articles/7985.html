<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>洪典桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>洪典桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7985">原文</a></p><p style="text-align: center"><img src="../assets/ba24381767e4f42a0a83.jpg" title="洪典桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style="font-size: 14px; font-family: 宋体;">&nbsp; &nbsp;洪典桥位于嘉兴市秀洲区王江泾镇洪典村</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">8</span><span style="font-size: 14px; font-family: 宋体;">组，根据桥额旁刻字，桥建于清道光十七年（</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">1837</span><span style="font-size: 14px; font-family: 宋体;">）。东西横跨洪典港，系三孔无拦石板桥，全长</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">18.1</span><span style="font-size: 14px; font-family: 宋体;">米</span><span style="font-size: 14px; font-family: 宋体;">，宽</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">2</span><span style="font-size: 14px; font-family: 宋体;">米，净跨</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">12.13</span><span style="font-size: 14px; font-family: 宋体;">米</span><span style="font-size: 14px; font-family: 宋体;">，矢高</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">2.6</span><span style="font-size: 14px; font-family: 宋体;">米</span><span style="font-size: 14px; font-family: 宋体;">。桥面由</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">3</span><span style="font-size: 14px; font-family: 宋体;">块长条石平铺，桥柱由</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">3</span><span style="font-size: 14px; font-family: 宋体;">块条石竖置构成，桥身刻有纹饰。桥额刻有“鼎建洪典桥”和“道光十七年”字样，两侧有回纹。北侧楹联为“东迎旭日庆升平，接长流承种福□”。南侧楹联不清晰。洪典桥造型简朴，构造稳重，在当地较有影响力，具有一定历史和科学价值。</span><span style="font-size: 14px; font-family: &quot;Times New Roman&quot;, serif;">2010</span><span style="font-size: 14px; font-family: 宋体;">年公布为嘉兴市文物保护点。</span><br/></p></html>
