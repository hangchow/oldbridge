<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三建村环桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>三建村环桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8016">原文</a></p><p style="text-align: center"><img src="../assets/01d000c17b1d14ede511.jpg" title="三建村环桥近景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;三建村环桥位于嘉兴市秀洲区王店镇三建村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">10</span><span style="font-size:14px;font-family:宋体">组，根据村民回忆及桥的形制判断为清代建筑。东西横跨环桥港，系单孔无栏石拱桥，桥全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">11.8</span><span style="font-size:14px;font-family:宋体">米，桥面宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.3</span><span style="font-size:14px;font-family:宋体">米，落坡宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.5</span><span style="font-size:14px;font-family:宋体">米，略呈喇叭状。拱跨</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">5.65</span><span style="font-size:14px;font-family:宋体">米，矢高</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.9</span><span style="font-size:14px;font-family:宋体">米。桥面及两侧落坡石阶均被泥土淹没。环桥曾是当地村民出行的重要交通工具，是嘉兴地区现存为数不多的石拱桥之一，具有一定的历史文物价值和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市级文保点。</span></p></html>
