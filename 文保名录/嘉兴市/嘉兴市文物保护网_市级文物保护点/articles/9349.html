<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>聚龙桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>聚龙桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2022-05-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=9349">原文</a></p><p style="text-align: center; line-height: 2em;"><img src="../assets/a7bb061a79c3349a450b.jpg" title="2、聚龙桥北立面.JPG" width="600" height="397" border="0" hspace="0" vspace="0" style="width: 600px; height: 397px;"/></p><p style="text-indent: 32px; line-height: 2em;"><span style=";font-family:宋体;font-size:16px"><span style="font-family: 宋体, SimSun; font-size: 14px;">聚龙桥位于南湖区大桥镇胥山村，东西横跨聚龙港，俗称曹家桥。始建年代不详，明崇祯《嘉兴县志》已记载有“曹家桥”，现桥重建于清乾隆六十年（1795）。三孔无栏梁式石板桥，全长24.75米，桥面宽1.76米，由三块石板分三节平铺而成，东西侧分别有13级和7级台阶。共八个天磐石。南北桥额上刻有“重建聚龙桥”和“大清乾隆六十年四月”，并有卷草纹。无楹联。该桥保存较好，纪年明确，造型简朴，具有较高的历史和科学价值。2021年被公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
