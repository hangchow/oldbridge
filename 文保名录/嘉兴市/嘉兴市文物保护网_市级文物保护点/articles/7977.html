<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三水湾遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>三水湾遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7977">原文</a></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体"></span></p><p style="text-align: center"><img src="../assets/13252bd2fda99e3d151f.jpg" title="三水湾遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体"></span><br/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;三水湾遗址位于嘉兴市秀洲区油车港镇上睦村（原三水湾村），南临申嘉湖高速公路，西临京杭大运河，北有乡村公路，面积约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">20000</span><span style="font-size:14px;font-family:宋体">平方米。该遗址是</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1986</span><span style="font-size:14px;font-family:宋体">年开挖河道和鱼塘时，当地村民张大有发现陶罐等器物并送交嘉兴博物馆。遗址未发掘，已遭破坏，可见文化层厚约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">0.2</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">。以往的文物调查中曾采集到泥质灰陶罐、鼎、盆、砺石等标本，根据这些器物判断该遗址属新石器时代良渚文化。虽由于条件所限没有试掘，但其资料记录明确，有待进一步研究确认，因而具有一定的历史价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1995</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
