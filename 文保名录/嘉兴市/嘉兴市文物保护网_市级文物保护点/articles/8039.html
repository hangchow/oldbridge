<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>张墩村礼堂</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>张墩村礼堂</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-06 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8039">原文</a></p><p style="text-align: center"><img src="../assets/64c1775c94007917d142.jpg" title="张墩村礼堂外景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 张墩村礼堂位于浙江省嘉兴市秀洲区新塍镇康和桥村原张墩自然村，坐西朝东。原为文革时礼堂，</span>1995年卖给私人作纺织厂房。礼堂面阔20.69米，进深8.86米，顶高5.88米。砖木结构，人字型梁架，共六开间。礼堂所在地文革时为前进大队，后改为张墩村，现并入康和桥村。张墩村礼堂是文革时期遗留下来的建筑，带有明显的文革气息和特征，是研究文革历史的重要实物，有一定的历史、科学价值。2009年与</span><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">知青宿舍、食堂、厂房</span></span><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">合并公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
