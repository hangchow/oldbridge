<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>洛兴村永昌桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>洛兴村永昌桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-06 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8041">原文</a></p><p><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体"></span></span></p><p style="text-align: center"><img src="../assets/06d9689c5c9bd7afd7c3.jpg" title="洛兴村永昌桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体"></span></span><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 洛兴村永昌桥位于嘉兴市秀洲区新塍镇洛兴村</span>15组与16组的交界处。据当地村民介绍，该桥建于民国时期。南北横跨东石桥浜，系三孔梁式平板石桥，全长16米，宽1.55米，桥底距水面高度2.59米。桥面由两块弧形石板平铺而成，桥柱有两块石板竖置组成。东西两侧桥额刻“永昌桥”字样。无桥联，无纹饰。永昌桥纵剖面略呈弧形，形制较特别，在嘉兴地区较为少见，是研究古代石梁桥的珍贵资料，具有较高的科学价值。2009年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
