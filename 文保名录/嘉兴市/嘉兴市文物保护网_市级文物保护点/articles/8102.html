<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>铁路公房</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>铁路公房</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8102">原文</a></p><p style="text-align: center"><img src="../assets/c291c3330c738014bea4.jpg" title="铁路公房远景2.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 铁路公房位于嘉兴市南湖区解放街道虹桥社区宣公弄</span>14号，是抗日战争时期，日军建造的火车站配套建筑，建国后作为公租房，由房管所管理。公房占地面积182.8平方米，坐北朝南，砖木结构，系二层六开间楼房，通面阔20.6米，通进深8.9米。屋顶为悬山顶，墙体用青砖砌筑，四面开有方形门窗。铁路公房是日军侵华的见证，对于研究嘉兴抗战史具有较高的历史价值。2010年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
