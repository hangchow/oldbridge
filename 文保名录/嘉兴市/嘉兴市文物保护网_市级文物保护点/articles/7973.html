<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>南墓城遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>南墓城遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7973">原文</a></p><p><br/></p><p style="text-align: center"><img src="../assets/ed0f9ef8e90f7c5722de.jpg" title="南墓城遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;南墓城遗址位于嘉兴市秀洲区王江泾镇阳城村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1</span><span style="font-size:14px;font-family:宋体">组，西接阳城村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">9</span><span style="font-size:14px;font-family:宋体">组，东接墓城港，北靠乍嘉苏高速公路。墓城港名称明万历《秀水县志》已有记载。南墓城遗址现已无高墩，地面上建造有大量村民住房，地面已找不到陶器标本，遗址范围不清。据第二次文物普查资料，该遗址大致相当于新石器时代崧泽文化至良渚文化时期，年代久远，类型较典型，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
