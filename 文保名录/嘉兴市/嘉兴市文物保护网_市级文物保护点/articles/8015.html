<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>庆丰街码头</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>庆丰街码头</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8015">原文</a></p><p style="text-align: center"><img src="../assets/5b658c3d8bb1769e4374.jpg" title="庆丰街码头远景.jpg" width="364" height="551" border="0" hspace="0" vspace="0" style="width: 364px; height: 551px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;庆丰街码头位于嘉兴市秀洲区王店镇塘桥社区庆丰街</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">157-159</span><span style="font-size:14px;font-family:宋体">号，沿长水塘西岸，据村民介绍为清代所建，石埠头坐西朝东，东西、南北各有七级台阶，邦岸自上而下分三层共有</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">5</span><span style="font-size:14px;font-family:宋体">个牛鼻石。三开间平房紧临石埠头，内有小阁楼，曾是米行名“潘雅记”，码头则是用来停泊旧时的“财船”。庆丰街码头是嘉兴市少数仅存的传统商用码头，是江南水乡传统水上贸易繁盛的实证，有较高的历史价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2009</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
