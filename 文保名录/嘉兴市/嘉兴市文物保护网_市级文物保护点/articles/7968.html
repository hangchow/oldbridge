<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>孙家汇遗存</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>孙家汇遗存</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7968">原文</a></p><p><span style="font-family: 宋体, SimSun; font-size: 14px;"></span></p><p style="text-align: center; line-height: 2em;"><img src="../assets/de53e71bc484983ec37c.jpg" style="width: 551px; height: 365px;" title="孙家汇遗存1.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p style="line-height: 2em;"><span style="font-size: 14px; font-family: 宋体, SimSun;"></span><br/></p><p style="text-align: center; line-height: 2em;"><img src="../assets/33e807a66bdb24afba53.jpg" style="width: 551px; height: 365px;" title="孙家汇遗存2.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p style="line-height: 2em;"><span style="font-family: 宋体, SimSun; font-size: 14px;">&nbsp;&nbsp;</span></p><p style="line-height: 2em;"><span style="font-family: 宋体, SimSun; font-size: 14px;">&nbsp;&nbsp;孙家汇遗存位于嘉兴市秀洲区王江泾镇范滩村</span><span style="font-family: 宋体, SimSun; font-size: 14px;">6</span><span style="font-family: 宋体, SimSun; font-size: 14px;">组，高墩高出于田地约</span><span style="font-family: 宋体, SimSun; font-size: 14px;">7</span><span style="font-family: 宋体, SimSun; font-size: 14px;">米</span><span style="font-family: 宋体, SimSun; font-size: 14px;">，呈“凹”字型，面积约有</span><span style="font-family: 宋体, SimSun; font-size: 14px;">5000</span><span style="font-family: 宋体, SimSun; font-size: 14px;">平方米。由于</span><span style="font-family: 宋体, SimSun; font-size: 14px;">20</span><span style="font-family: 宋体, SimSun; font-size: 14px;">世纪</span><span style="font-family: 宋体, SimSun; font-size: 14px;">70</span><span style="font-family: 宋体, SimSun; font-size: 14px;">年代中期，砖厂大量取土，遗址形成南高北低的坡度，根据出土器物判断，为新石器时代至春秋战国时期的遗址。遗址高墩明显，延续时间长，具有较高的历史和科学价值。</span><span style="font-family: 宋体, SimSun; font-size: 14px;">1992</span><span style="font-family: 宋体, SimSun; font-size: 14px;">年公布为嘉兴市文物保护点。</span><br/></p></html>
