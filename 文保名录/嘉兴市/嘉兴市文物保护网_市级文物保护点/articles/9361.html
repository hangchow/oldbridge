<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>油车港镇开关厂旧址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>油车港镇开关厂旧址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2022-05-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=9361">原文</a></p><p style="text-align: center; line-height: 2em;"><img src="../assets/13c5b20bb49812df53bc.jpg" title="1、老开关厂房北立面远景.JPG" width="600" height="397" border="0" hspace="0" vspace="0" style="width: 600px; height: 397px;"/></p><p style="text-indent: 32px; line-height: 2em;"><span style=";font-family:宋体;font-size:16px"><span style="font-family: 宋体, SimSun; font-size: 14px;">油车港镇开关厂旧址位于秀洲区油车港镇港南大街。建厂具体时间不详，据老工人回忆原为草包厂，1968年后改为开关厂，并建办公楼及厂房。现存建筑3栋，总建筑占地面积约763平方米，自北向南平行排列，砖混结构，主要使用小青砖，屋顶为硬山顶。最北一间二层楼房为办公楼，通面阔32米，通进深8.2米。南面两间平房为生产车间，规格相同，通面阔30.5米，通进深8.2米。该旧址建筑布局尚完整，保存较好，是嘉兴工业历史发展难得的实物见证，具有较高的历史和科学价值。2021年被公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
