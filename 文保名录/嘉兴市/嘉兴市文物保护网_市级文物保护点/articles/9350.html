<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>凤仪桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>凤仪桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2022-05-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=9350">原文</a></p><p style="text-align: center; line-height: 2em;"><img src="../assets/dd90113daf91985b194c.jpg" title="1、凤仪桥西立面.JPG" width="600" height="397" border="0" hspace="0" vspace="0" style="width: 600px; height: 397px;"/></p><p style="text-indent: 32px; line-height: 2em;"><span style=";font-family:宋体;font-size:16px"><span style="font-family: 宋体, SimSun; font-size: 14px;">凤仪桥位于秀洲区新塍镇康和桥村7组，南北横跨凤仪桥港，又名张墩环桥。始建年代不详，现桥建于嘉庆十九年（1814）。单孔有栏石拱桥，全长13.2米，桥面宽2.5米，拱跨5.6米，矢高3米，南北各有台阶12级。共4个天磐石。东西桥额上刻有“凤仪桥”，东西桥联分别为：“晓日浴红春水上，遥山横碧画桥西”“千顷桑麻歌大有，万家烟井颂升平”该桥桥额、楹联清晰，具有较高的历史和艺术价值。2021年被公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
