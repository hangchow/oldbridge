<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>金桥遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>金桥遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7970">原文</a></p><p style="text-align: center"><img src="../assets/59099424fa99bb7e23d3.jpg" style="width: 551px; height: 365px;" title="金桥遗址远景1.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="text-align: center"><img src="../assets/4e19f3cf83784c50e1f4.jpg" style="width: 551px; height: 365px;" title="金桥遗址远景2.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="line-height: 2em;"><span style="font-size: 14px; font-family: 宋体, SimSun;">&nbsp;&nbsp;金桥遗址位于嘉兴市秀洲区王江泾镇双桥村42组（小地名童桥角，原金桥村），三面临河，东临京杭大运河，南为红旗荡，西为东荡。面积约60000平方米，文化层厚约0.4米。在过去的文物调查中发现墓葬1座，已受扰动，采集陶器以泥质灰陶为主，都为素面，有罐两件，陶杯和陶环各一件，属良渚文化；另采集有春秋战国时期少量印纹陶片。据此可判断该遗址年代为新石器时代良渚文化至春秋战国时期。该遗址范围较大，延续时间长，出土文物种类丰富，具有较高的历史和科学价值。1992年公布为嘉兴市文物保护点。</span></p></html>
