<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>郎家桥遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>郎家桥遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7971">原文</a></p><p><br/></p><p style="text-align: center"><img src="../assets/172de2362aaeb8697da0.jpg" title="郎家桥遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p><br/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;郎家桥遗址位于嘉兴市秀洲区王江泾镇西雁村村委会西南处，遗址北是石雁荡，南为天花荡，在河荡的包围之中，地势低凹，遗址大部分已被河荡淹没，仅留存</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">100</span><span style="font-size:14px;font-family:宋体">余平方米的田地，文化层厚约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">60</span><span style="font-size:14px;font-family:宋体">厘米。第二次全国文物普查中出土陶片主要是泥质灰黑陶，采集器型标本有罐口沿、圈足盆等，并有夹砂陶鱼鳍形鼎足等，但未采集到石器。从出土器物分析，这个遗址属新石器时代良渚文化晚期。标志牌位于郎嘉桥西约</span><span style="font-size:14px;font-family: &#39;Times New Roman&#39;,&#39;serif&#39;">100</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">处。遗址属良渚文化晚期，代表类型较典型，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
