<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>姜家残牌坊</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>姜家残牌坊</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8095">原文</a></p><p style="text-align: center"><img src="../assets/ec457bf14c83c4c6edfb.jpg" title="姜家残牌坊1.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;姜家残牌坊位于嘉兴市南湖区新丰镇乌桥村牌楼浜自然村。据当地人介绍为明代遗物，东西向并排竖立，目前牌楼仅存四根石柱，石柱为花岗石材质，其余部分文革时被破坏。中间两根石柱高</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">5.35</span><span style="font-size:14px;font-family:宋体">米，柱径面积为</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">0.52</span><span style="font-size:14px;font-family:宋体">×</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">0.52</span><span style="font-size:14px;font-family:宋体">平方米；两侧两根石柱高</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">4.35</span><span style="font-size:14px;font-family:宋体">米，柱径面积为</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">0.50</span><span style="font-size:14px;font-family:宋体">×</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">0.50</span><span style="font-size:14px;font-family:宋体">平方米。中间两根石柱间距</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3.97</span><span style="font-size:14px;font-family:宋体">米，侧柱与中柱间距</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.90</span><span style="font-size:14px;font-family:宋体">米，石柱上有四处卯口，该残牌楼在嘉兴地区发现的牌楼中规模最大，虽然破损严重，但仍有很高的历史价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2009</span><span style="font-size:14px;font-family:宋体">年公布为市级文保点。</span></p></html>
