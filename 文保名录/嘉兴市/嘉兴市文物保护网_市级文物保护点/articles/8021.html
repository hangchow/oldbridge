<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>一里街碉堡</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>一里街碉堡</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8021">原文</a></p><p><span style="font-size:14px;font-family:宋体"></span></p><p style="text-align: center"><img src="../assets/0f90b7988fe76cda2aa0.jpg" title="一里街碉堡远景.jpg" width="364" height="551" border="0" hspace="0" vspace="0" style="width: 364px; height: 551px;"/></p><p><span style="font-size:14px;font-family:宋体"></span><br/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;一里街碉堡位于嘉兴市秀洲区江泾镇王闻川社区一里街西端，南临市河，是抗日战争时期日军的军事据点，碉堡呈圆柱形，外径4米，内径3米，高5.4米。碉堡顶四周围墙开有垛口，专供瞭望监视。墙体用青砖砌筑，外立面共设6个射击孔，孔口内小外大，呈喇叭状。一里街碉堡是日军侵华的罪证，对于研究抗日战争史有较高的历史价值。2002年公布为嘉兴市文物保护点。</span></p></html>
