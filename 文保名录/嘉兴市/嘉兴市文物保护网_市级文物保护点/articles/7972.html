<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>倭墩浜遗迹</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>倭墩浜遗迹</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7972">原文</a></p><p><br/></p><p style="text-align: center"><img src="../assets/5bdbd9a02f64e3d78bf0.jpg" style="width: 551px; height: 365px;" title="倭墩浜遗迹远景1.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="text-align: center"><img src="../assets/205b77afe1a7bf25a82b.jpg" style="width: 551px; height: 365px;" title="倭墩浜遗迹远景2.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="line-height: 2em;">&nbsp;&nbsp;&nbsp;<span style="font-size: 14px; font-family: 宋体, SimSun;">&nbsp;倭墩浜遗迹位于嘉兴市王江泾镇新桥社区倭墩浜，东靠07省道，西止乡村水泥路。东西长约600米，宽约4～14米。明嘉靖三十四年（1555），倭寇扰犯，右都御兵部右侍郎张经，遣总兵俞大猷等剿倭，在王江泾获大捷，歼灭倭寇2000名。乡民纪念平倭大捷，在射襄桥南夹河中筑“平倭大捷山”石碑，勒石以示纪念，在王江泾镇南倭寇埋骨之处名“倭墩”，现其名倭墩浜。倭墩浜遗迹是明朝与倭寇作战的古战场，历史悠久，对研究倭寇窜犯嘉兴的历史提供实例，具有较高的历史价值和科学价值。2009年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
