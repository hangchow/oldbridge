<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>泰来当铺</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>泰来当铺</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2022-05-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=9353">原文</a></p><p style="text-align: center; line-height: 2em;"><img src="../assets/3dd1c3d84699491fe2d0.jpg" title="1、泰来当铺南立面.JPG" width="396" height="600" border="0" hspace="0" vspace="0" style="width: 396px; height: 600px;"/></p><p style="text-indent: 32px; line-height: 2em;"><span style=";font-family:宋体;font-size:16px"><span style="font-family: 宋体, SimSun; font-size: 14px;">泰来当铺位于秀洲区新塍镇西北大街36号，建于清至民国时期。原为当铺，民国之后改为“地方浙江银行”。原布局不明，现仅存一进二层楼房，面阔10.54米，进深6.86米，占地面积72.3平方米。坐北朝南，硬山顶，木梁架结构，穿斗式。南立面当中写有墨色大字“地方浙江银行”，东侧斑驳墙面下露出斗大“当”字，南立面为灰白色砖墙，当中有石库门，墙头上刻有莲花纹砖雕，山墙用青砖砌筑。泰来当铺作为金融商贸建筑，在嘉兴同类文物中尚属首次发现，具有较高的历史和科学价值。2021年被公布为嘉兴市文物保护点。</span></span></p><p><br/></p></html>
