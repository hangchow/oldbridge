<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>三建村白云桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>三建村白云桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8017">原文</a></p><p style="text-align: center"><img src="../assets/7a519d9c2b30ff20ace4.jpg" style="width: 551px; height: 365px;" title="三建村白云桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="text-align: center"><img src="../assets/578b0d52f5aa81c6ed2e.jpg" style="width: 551px; height: 365px;" title="三建村白云桥石阶.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;三建村白云桥位于嘉兴市秀洲区王店镇三建村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">23</span><span style="font-size:14px;font-family:宋体">组。据村民介绍及对桥形制的判断，此桥为清末所建。南北向跨顺路桥港，系单孔无栏梁式石板桥，桥全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">15.81</span><span style="font-size:14px;font-family:宋体">米，桥面宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1.58</span><span style="font-size:14px;font-family:宋体">米由</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3</span><span style="font-size:14px;font-family:宋体">块石板平铺而成，南北两侧各有石阶</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">8</span><span style="font-size:14px;font-family:宋体">级，桥额刻有“重建白云桥”，旁刻回字纹，每级石阶上皆刻</span><span style="font-size:14px;font-family:宋体">“白云桥”，桥楹联因条件限制无法记录。白云桥形制较完整，造型简洁、大方，雕饰精美，具有一定的历史和艺术价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
