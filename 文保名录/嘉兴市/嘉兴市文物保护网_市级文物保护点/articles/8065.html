<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>大坟遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>大坟遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8065">原文</a></p><p><span style="font-size:14px;font-family:宋体"></span></p><p style="text-align: center"><img src="../assets/bce838b5d422e07d3820.jpg" style="width: 551px; height: 365px;" title="大坟遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="text-align: center"><img src="../assets/fb60038d43a0bbceabc3.jpg" style="width: 551px; height: 365px;" title="大坟遗址采集标本.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;大坟遗址位于嘉兴市南湖区大桥镇江南村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">6</span><span style="font-size:14px;font-family:宋体">组，西北环河，面积较小，仅</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">447</span><span style="font-size:14px;font-family:宋体">平方米，为新石器良渚文化至春秋战国时期的遗址。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1985</span><span style="font-size:14px;font-family:宋体">年调查时在东南高地曾出土镂孔豆，贯耳壶等。文化层较厚，属良渚文化时期。西北高地文化层土色黑灰，厚约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">40</span><span style="font-size:14px;font-family:宋体">厘米左右，出土较多的印纹陶片。遗址反映了良渚时期至春秋战国时的面貌，延续时间较长，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
