<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>河西村遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>河西村遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-02 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=7978">原文</a></p><p style="text-align: center"><img src="../assets/178c5b9e9490a75d54c4.jpg" style="width: 551px; height: 365px;" title="河西村遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p><br/></p><p style="text-align: center"><img src="../assets/f33146de27f20a300843.jpg" style="width: 551px; height: 365px;" title="河西村遗址采集标本.jpg" width="551" height="365" border="0" hspace="0" vspace="0"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;河西村遗址位于嘉兴市秀洲区王店镇清泰桥村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">7</span><span style="font-size:14px;font-family:宋体">组河西自然村，清泰桥村委会南</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">500</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">左右，东临蒋桥港，北为莲花港，面积约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">20000</span><span style="font-size:14px;font-family:宋体">平方米。遗址高墩已无存，这次普查中在地面发现一件鱼鳍形鼎足和数件印纹陶片，据此可判断河西村遗址为新石器时代良渚文化时代至春秋战国时期的遗址。嘉兴新发现的遗址较少，河西村遗址延续时间长，分布面积广，器物类型较典型，具有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2009</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
