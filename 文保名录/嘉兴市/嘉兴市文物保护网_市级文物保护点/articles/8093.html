<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>建国村步云桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>建国村步云桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8093">原文</a></p><p style="text-align: center"><img src="../assets/3cd4ce0eadcc0a4ebe86.jpg" title="建国村步云桥远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;建国村步云桥位于嘉兴市南湖区大桥镇建国村徐家浜自然村与嘉善先锋村交界处。南北向跨章店桥港，为单孔石栏桥。桥始建年代不详，根据其形制推断为清时建。顶盘石刻有涡纹，桥额为“步云桥”，南北两侧各有台阶</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">12</span><span style="font-size:14px;font-family:宋体">级。桥全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">15.91</span><span style="font-size:14px;font-family:宋体">米，宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.83</span><span style="font-size:14px;font-family:宋体">米，高</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3.5</span><span style="font-size:14px;font-family:宋体">米。步云桥形制美观，有一定的历史文物和艺术价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2010</span><span style="font-size:14px;font-family:宋体">年公布为市级文保点。</span></p></html>
