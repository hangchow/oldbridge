<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>西小桥弄吴氏老宅</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>西小桥弄吴氏老宅</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-06 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8033">原文</a></p><p style="text-align: center"><img src="../assets/9a41e926932ca92a5a10.jpg" title="西小桥弄吴氏老宅外景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: normal;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp;&nbsp;</span></span></p><p style="line-height: 2em;"><span style=";font-family:宋体;font-size:14px"><span style="font-family:宋体">&nbsp; 西小桥弄吴氏老宅位于浙江省嘉兴市秀洲区新塍镇西小桥弄与丰乐街交汇处，就建筑形式判断为民国时期建造。原有布局不详，现存独立房屋，坐北朝南，通面阔</span>11.59米，通进深16.2米。一进二层楼房，硬山顶，层高8.28米，木梁架结构，抬梁式五檩，屋内地面铺设小青砖。前院地面铺设条石板，院当中有砖雕门楼，两侧原有走马堂楼，四周有风火墙。老宅梁架用料粗大，门楼、梁架、门窗等处雕工细致，建筑格局保存尚好，在嘉兴现有的民国时期乡土建筑中属精品，具有较高的历史价值。2009年公布为嘉兴市文物保护点。</span></p><p><br/></p></html>
