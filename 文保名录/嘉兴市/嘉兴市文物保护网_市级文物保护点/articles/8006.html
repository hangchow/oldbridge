<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>小金港村翁家桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>小金港村翁家桥</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-03 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8006">原文</a></p><p style="text-align: center"><img src="../assets/5de0d9d1722494d891aa.jpg" title="小金港村翁家桥近景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;小金港村翁家桥位于嘉兴市秀洲区新塍镇小金港村</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">7</span><span style="font-size:14px;font-family:宋体">组，与南洋村交界，南距申嘉湖高速约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">200</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">。据桥形制和当地村民介绍，综合判断此桥建于清代。南北横跨翁家桥港，系五孔无栏梁式石板桥。桥全长</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">21</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，宽</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">，桥面和桥柱均由</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">4</span><span style="font-size:14px;font-family:宋体">块石板组成，桥底距水面高度</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2.8</span><span style="font-size:14px;font-family:宋体">米</span><span style="font-size:14px;font-family:宋体">。南北落坡各设石阶</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">5</span><span style="font-size:14px;font-family:宋体">级和</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">4</span><span style="font-size:14px;font-family:宋体">级，桥额刻“重建翁家桥”，桥身刻有纹饰。申嘉湖高速建成后，翁家桥逐渐弃用。此桥曾处在重要的水上交通要道上，做工考究，保存较好，在当地古桥中属精品，具有较高的历史和艺术价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">2009</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
