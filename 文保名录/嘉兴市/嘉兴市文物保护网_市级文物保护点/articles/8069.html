<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>刘家坟遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>刘家坟遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8069">原文</a></p><p style="text-align: center"><img src="../assets/156ed18fcd127301bce7.jpg" title="刘家坟遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;刘家坟遗址位于嘉兴市南湖区新丰镇横港村石缺组。四周环河，南为姚花港，东为东青龙港，西接刘家坟水泥桥，南连广福桥，为新石器时代良渚文化至春秋战国时期聚落址。遗址面积约</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">75000</span><span style="font-size:14px;font-family:宋体">平方米，曾出土较多的陶片和石器。下层为良渚时期文化层，有泥质灰陶，陶质比较松软，上层多为印纹陶，陶片较硬，纹饰为绳纹、方格纹等，该遗址分布范围较大，延续时间较长，文化遗迹较丰富，有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市级文物保护点。</span></p></html>
