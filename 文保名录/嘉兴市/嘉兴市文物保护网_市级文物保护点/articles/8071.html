<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>韩家浜遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>韩家浜遗址</h1><p>嘉兴市文物保护网 · 市级文物保护点 · 2020-11-09 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=8071">原文</a></p><p style="text-align: center"><img src="../assets/b5ec33fc12f3e1ab4cd8.jpg" title="韩家浜遗址远景.jpg" width="551" height="365" border="0" hspace="0" vspace="0" style="width: 551px; height: 365px;"/></p><p style="line-height: 2em;"><span style="font-size:14px;font-family:宋体">&nbsp;&nbsp;韩家浜遗址位于嘉兴市南湖区新丰镇竹林村幼儿园内及周边。该遗址原面积</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">80000</span><span style="font-size:14px;font-family:宋体">平方米（</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">800</span><span style="font-size:14px;font-family:宋体">×</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">100</span><span style="font-size:14px;font-family:宋体">）分布在水田和高地中，因新建民房，经常动土，遗址破坏日益严重，现存面积</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">3600</span><span style="font-size:14px;font-family:宋体">平方米。该遗址曾出土陶器以泥质黑陶、灰陶为主，采集标本器有：壶、豆、鼎、镂空豆把、双鼻圈足壶、提梁壶等，石器有石斧等完整器数件，可判断属新石器时代良渚文化遗址。遗址出土器物文化类型较典型，具有较高的历史和科学价值。</span><span style="font-size:14px;font-family:&#39;Times New Roman&#39;,&#39;serif&#39;">1992</span><span style="font-size:14px;font-family:宋体">年公布为嘉兴市文物保护点。</span></p></html>
