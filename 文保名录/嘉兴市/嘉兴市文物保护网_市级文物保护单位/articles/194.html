<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>严助墓</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>严助墓</h1><p>嘉兴市文物保护网 · 市级文物保护单位 · 2014-06-13 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=194">原文</a></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p style="text-align: center;"><img title="严助墓" src="../assets/d6d03eb6b697f9624991.jpg"/></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p style="line-height: 2em; text-indent: 2em;"><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">严助墓位于嘉兴市南湖区建设街道瓶山社区辅成小学内，是西汉名士严助的坟茔。严助（？～前</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">112</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">）西汉会稽郡吴县人，本名严庄助，辞赋家，富文采，擅辞赋，官至会稽太守。墓呈圆形，面积</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">2157</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">平方米，周长</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">174</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">米。墓丘上草木茂盛，郁郁葱葱，环境幽静。墓穴、墓碑已无存。据嘉兴人庞艺影《话说严助》一文考证，此墓的真实性尚且存疑。该墓历史悠久，为研究严助及当地古代葬俗提供了实物资料，具有较高的历史价值。</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">1992</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">年公布为嘉兴市级文物保护单位。</span></p></html>
