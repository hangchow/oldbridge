<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>鉏家桥</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>鉏家桥</h1><p>嘉兴市文物保护网 · 市级文物保护单位 · 2014-06-16 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=212">原文</a></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p style="text-align: center;"><img title="鉏家桥" src="../assets/c8268c5efddb409e6498.jpg"/></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p style="line-height: 2em; text-indent: 2em;"><span style="font-family: 宋体; font-size: 10.5pt; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">鉏家桥位于嘉兴市南湖区解放街道航明社区光明街，建造于民国<span lang="EN-US">22</span>年（<span lang="EN-US">1933</span>），东西横跨鉏家滩，是一座水泥和石块结合的桥，全长<span lang="EN-US">15.23</span>米，宽<span lang="EN-US">3.9</span>米，桥面距水面为<!--?xml:namespace prefix="st1" ns="urn:schemas-microsoft-com:office:smarttags"--><st1:chmetcnv w:st="on" tcsc="0" numbertype="1" negative="False" hasspace="False" sourcevalue="3" unitname="米"><span lang="EN-US">3</span>米</st1:chmetcnv>。东西桥墩用石块砌筑，桥梁和桥面为水泥浇筑，并设有水泥护栏，望柱塑成方形，桥面中间护栏上立有两根水泥灯柱。<span lang="EN-US">1989</span>年在老桥东又建新桥，此桥逐渐废弃。鉏家桥造型简洁，风格别致，带有典型的民国特征，为研究嘉兴近代桥梁建筑提供了实物资料，具有较高历史和艺术价值。<span lang="EN-US">2010</span>年公布为嘉兴市级文物保护单位。<!--?xml:namespace--></span></p></html>
