<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>龚宝铨故居</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>龚宝铨故居</h1><p>嘉兴市文物保护网 · 市级文物保护单位 · 2014-06-18 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=230">原文</a></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span></p><p style="text-align: center;"><img title="龚宝铨故居" src="../assets/fd769114cdd060d12c52.jpg"/></p><p style="text-indent: 0px; "><span style="text-indent: 32px; line-height: 150%;">&nbsp; &nbsp; &nbsp;&nbsp;<span style="font-family: 宋体; font-size: 14px;">龚宝铨</span><span style="font-family: 宋体; line-height: 150%; font-size: 14px;">(1883～1922)，嘉兴人，近代资产阶级革命家，为光复会的重要领导人之一，先后介绍章太炎、徐锡麟等人入会。曾担任过浙江图书馆馆长、都督府外交顾问等职。其故居位于油车港镇宝铨路41号，清代</span><span style="font-family: 宋体; font-size: 14px;">建筑，砖木结构，由坐西朝东二层楼房和坐北朝南平房组成，建筑面积</span></span><span style="text-indent: 32px; font-family: 宋体; line-height: 150%; font-size: 14px;">356平方米。2009年，故居公布为市级文物保护单位。2011年，故居完成修缮布展对外免费开放。</span></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span></p></html>
