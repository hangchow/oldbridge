<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>唐兰故居</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>唐兰故居</h1><p>嘉兴市文物保护网 · 市级文物保护单位 · 2014-06-19 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=232">原文</a></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p style="text-align: center;"><img title="唐兰故居" src="../assets/bb3867f6ea69b660afd6.jpg"/></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span> &nbsp; &nbsp; &nbsp;<span style="text-indent: 32px; font-family: 宋体; line-height: 150%;"><span style="font-size: 14px;">唐兰（</span><span style="line-height: 150%; font-size: 14px;">1900～1979），嘉兴人，现代著名学者、古文字学家、青铜器学家、先秦史学家、诗人。曾任清华、北大教授，故宫博物院副院长等职。其故居位于市区秀水兜106号，民国建筑，坐北朝南，砖木结构，有天井、二层楼房、厢房等组成，建筑面积237平方米，现有</span><span style="font-size: 14px;">唐兰后人居住。</span></span><span style="text-indent: 32px; font-family: 宋体; line-height: 150%; font-size: 14px;">2000年，故居公布为市级文物保护单位。</span></p></html>
