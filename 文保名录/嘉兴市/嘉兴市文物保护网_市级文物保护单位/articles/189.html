<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>步云遗址</title><style>body{max-width:1000px;margin:32px auto;padding:0 20px;font:18px/1.8 sans-serif}img{max-width:100%;height:auto!important}p{margin:1em 0}table{max-width:100%}</style><h1>步云遗址</h1><p>嘉兴市文物保护网 · 市级文物保护单位 · 2014-06-13 · <a href="https://www.jxwwbh.cn/ArticleShow.aspx?ID=189">原文</a></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p style="text-align: center;"><img title="步云遗址" src="../assets/c502e9a62e910403c98f.jpg"/></p><p><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span>&nbsp;</p><p style="line-height: 2em;"><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;"></span></p><p style="line-height: 2em; text-indent: 2em;"><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">步云遗址位于嘉兴市南湖区大桥镇花园村花园社区，原貌大致呈方形，占地面积约</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">4700</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">平方米。现遗址范围内土地被敬老院和塑料厂、帽服饰厂等占用，早期地形、地貌已无法辨认。据以往调查资料记载，遗址分布面积较广，东西约</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">60</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">米，南北</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">30</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">米，原文化层厚约</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">40</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">厘米，曾出土有孔石斧和一些陶片，属新石器时代良渚文化遗物，也曾出土过印纹陶器和石斧、石刀等春秋战国时期遗物。现由于环境破坏较严重，尚未找到明显文化层。该遗址具一定规模，延续时间长，有较高的历史和科学价值。</span><span style="font-family: &quot;Times New Roman&quot;,&quot;serif&quot;; font-size: 10.5pt; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA; mso-fareast-font-family: 宋体;" lang="EN-US">1981</span><span style="font-family: 宋体; font-size: 10.5pt; mso-ascii-font-family: &quot;Times New Roman&quot;; mso-hansi-font-family: &quot;Times New Roman&quot;; mso-bidi-font-family: &quot;Times New Roman&quot;; mso-font-kerning: 1.0pt; mso-ansi-language: EN-US; mso-fareast-language: ZH-CN; mso-bidi-language: AR-SA;">年公布为嘉兴市级文物保护单位。</span></p></html>
